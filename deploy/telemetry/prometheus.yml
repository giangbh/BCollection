global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'bcollection-core-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8088']
        labels:
          application: 'bcollection-platform'
          tier: 'core-backend'

  - job_name: 'legacy-api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          application: 'bcollection-platform'
          tier: 'legacy-gateway'
